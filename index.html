<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Campus Venues & Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
        @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
        .pop { animation: pop .3s ease-out both; }
        @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
        .star-active { color: #f59e0b; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased pb-20">
    <div class="max-w-md mx-auto px-4 pt-4">

        <header class="relative overflow-hidden rounded-3xl p-5 mb-4 text-white shadow-lg bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600">
            <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10"></div>
            <div class="absolute right-10 -bottom-10 w-24 h-24 rounded-full bg-white/10"></div>
            <h1 class="relative text-3xl font-extrabold tracking-tight">IFM Campus</h1>
            <p class="relative flex items-center gap-2 mt-1 text-sm font-medium text-blue-100">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-300"></span>
                </span>
                <span id="currentTimeDisplay">Loading time...</span>
            </p>
            <p class="relative mt-3 text-sm text-white/80">Find a free room or view your class timetable.</p>
        </header>

        <div id="notice" class="hidden mb-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200 text-sm p-3"></div>

        <!-- Search Bar & Quick Filters -->
        <div id="searchWrapper" class="mb-4 space-y-3">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search room (e.g., TH E, 342)..." autocomplete="off"
                    class="w-full p-3 pl-4 pr-10 rounded-xl border border-slate-300 bg-white dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                <button id="clearSearch" type="button" aria-label="Clear search"
                    class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">&times;</button>
            </div>
            
            <!-- 2+ Hours Filter -->
            <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Free for 2+ Hours (Group Study)</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="filter2Hours" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-indigo-600"></div>
                </label>
            </div>
        </div>

        <!-- 3-Way Toggle Menu -->
        <div class="sticky top-2 z-10 mb-5">
            <div class="flex bg-slate-200/90 dark:bg-slate-800/90 backdrop-blur p-1 rounded-2xl shadow-inner text-sm">
                <button id="btnAvailable" aria-pressed="true" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">Free Now</button>
                <button id="btnBusy" aria-pressed="false" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">In Use</button>
                <button id="btnTimetable" aria-pressed="false" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">My Classes</button>
            </div>
        </div>

        <!-- ROOM VIEWS -->
        <div id="availableContainer" class="space-y-3"></div>
        <div id="busyContainer" class="space-y-3 hidden"></div>

        <!-- TIMETABLE VIEW -->
        <div id="timetableContainer" class="hidden space-y-4">
            <select id="courseSelect" class="w-full p-3 rounded-xl border border-slate-300 bg-white dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm font-semibold">
                <option value="">-- Select your Course --</option>
            </select>
            <div id="timetableList" class="space-y-6"></div>
        </div>

        <footer class="mt-12 pt-6 border-t border-slate-300 dark:border-slate-800 text-center text-sm text-slate-500 dark:text-slate-400 space-y-2">
            <p class="font-bold text-slate-700 dark:text-slate-200">Built by Raheem</p>
            <div class="flex flex-col items-center justify-center space-y-1">
                <a href="mailto:idonrushs@gmail.com" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">idonrushs@gmail.com</a>
                <a href="tel:+255770931544" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">+255 770 931 544</a>
                <a href="https://instagram.com/sincerely.raheem" target="_blank" rel="noopener noreferrer" class="hover:text-pink-600 dark:hover:text-pink-400 transition-colors">IG: @sincerely.raheem</a>
            </div>
        </footer>
    </div>

    <script>
        const CAMPUS_TZ = "Africa/Dar_es_Salaam";
        let roomMeta = {}; // Will hold rooms.json data
        let favorites = JSON.parse(localStorage.getItem('ifm_fav_rooms') || '[]');

        function campusNow(date = new Date()) {
            const parts = new Intl.DateTimeFormat("en-GB", { timeZone: CAMPUS_TZ, weekday: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(date);
            const get = t => parts.find(p => p.type === t).value;
            const hour = parseInt(get("hour"), 10) % 24, minute = parseInt(get("minute"), 10);
            return { day: get("weekday"), minutes: hour * 60 + minute, label: fmtMin(hour * 60 + minute) };
        }

        function toMin(t) { const [h, m] = t.split(":"); return parseInt(h, 10) * 60 + parseInt(m, 10); }
        function fmtMin(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
        function fmtDuration(m) { if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return r ? h + "h " + r + "m" : h + "h"; }

        function buildIndex(bookings) {
            const byVenue = new Map(); const daysWithClasses = new Set(); let open = 24 * 60, close = 0;
            for (const raw of bookings) {
                if (!raw.venue || !raw.venue.trim()) continue;
                const b = { ...raw, venue: raw.venue.trim(), s: toMin(raw.start), e: toMin(raw.end) };
                if (!(b.e > b.s)) continue;
                open = Math.min(open, b.s); close = Math.max(close, b.e); daysWithClasses.add(b.day);
                if (!byVenue.has(b.venue)) byVenue.set(b.venue, new Map());
                const days = byVenue.get(b.venue);
                if (!days.has(b.day)) days.set(b.day, []);
                days.get(b.day).push(b);
            }
            for (const days of byVenue.values()) for (const list of days.values()) list.sort((a, c) => a.s - c.s);
            const venues = [...byVenue.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            return { byVenue, venues, open, close, daysWithClasses };
        }

        function getRoomStates(index, day, nowMin, search = "") {
            const q = search.trim().toUpperCase(); const free = [], busy = [];
            for (const venue of index.venues) {
                if (q && !venue.toUpperCase().includes(q)) continue;
                const today = index.byVenue.get(venue).get(day) || [];
                const current = today.filter(b => b.s <= nowMin && nowMin < b.e);

                if (current.length) {
                    const groups = new Map();
                    for (const b of current) {
                        const key = b.module + "|" + b.type;
                        if (!groups.has(key)) groups.set(key, { module: b.module, type: b.type, courses: [] });
                        const g = groups.get(key); const course = b.course || "Unknown Course";
                        if (!g.courses.includes(course)) g.courses.push(course);
                    }
                    busy.push({ venue, startMin: Math.min(...current.map(b => b.s)), busyUntil: Math.max(...current.map(b => b.e)), groups: [...groups.values()] });
                } else {
                    const next = today.find(b => b.s > nowMin);
                    free.push({ venue, nextStart: next ? next.s : null, hadClassesToday: today.length > 0 });
                }
            }
            return { free, busy };
        }

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const state = { index: null, bookings: [], now: null, view: "available", search: "", lastKey: "", selectedCourse: "", filter2Hours: false };
        const $ = id => document.getElementById(id);

        const BTN_BASE = "flex-1 py-2 rounded-xl font-bold transition-all duration-200 ";
        const BTN_ON = { available: "bg-white dark:bg-slate-700 shadow text-emerald-700 dark:text-emerald-300", busy: "bg-white dark:bg-slate-700 shadow text-rose-700 dark:text-rose-300", timetable: "bg-white dark:bg-slate-700 shadow text-indigo-700 dark:text-indigo-300" };
        const BTN_OFF = "text-slate-500 dark:text-slate-400";
        const CARD = "pop bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm ring-1 ring-slate-200/70 dark:ring-slate-800 border-l-4 relative ";

        // Helper to generate Star & Share buttons
        function actionButtons(venue) {
            const isFav = favorites.includes(venue);
            const starClass = isFav ? "star-active" : "text-slate-300 dark:text-slate-600";
            return `<div class="flex gap-2">
                <button class="star-btn text-xl ${starClass} hover:scale-110 transition-transform" data-venue="${esc(venue)}" aria-label="Favorite">★</button>
                <button class="share-btn text-slate-400 hover:text-indigo-500 transition-colors" data-venue="${esc(venue)}" aria-label="Share">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                </button>
            </div>`;
        }

        function getMeta(venue) {
            const m = roomMeta[venue];
            if (!m) return "";
            return `<p class="text-[11px] text-slate-400 mt-0.5 uppercase tracking-wide font-semibold">${esc(m.building)} &middot; ${esc(m.floor)}</p>`;
        }

        function freeCard(r, i, animate) {
            let sub = r.nextStart !== null 
                ? `Free until <span class="font-bold text-slate-800 dark:text-slate-100">${fmtMin(r.nextStart)}</span> <span class="text-slate-400">&middot; ${fmtDuration(r.nextStart - state.now.minutes)}</span>`
                : (r.hadClassesToday ? "Free for the rest of today" : "Free all day");
            
            return `<div class="${CARD}border-emerald-500" ${anim(i, animate)}>
                <div class="flex justify-between items-start">
                    <div class="flex-1 min-w-0 pr-2">
                        <h3 class="text-xl font-bold truncate">${esc(r.venue)}</h3>
                        ${getMeta(r.venue)}
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${sub}</p>
                    </div>
                    ${actionButtons(r.venue)}
                </div>
                <div class="mt-2 text-right"><span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 text-xs px-2.5 py-1 rounded-full font-semibold">Available</span></div>
            </div>`;
        }

        function busyCard(r, i, animate) {
            const total = r.busyUntil - r.startMin;
            const pct = Math.min(100, Math.max(0, Math.round((state.now.minutes - r.startMin) / total * 100)));
            const left = r.busyUntil - state.now.minutes;
            const groups = r.groups.map(g => `
                <div class="mt-2"><p class="text-sm font-semibold text-slate-700 dark:text-slate-200 break-words">${esc(g.type)} &middot; ${esc(g.module)}</p>
                <div class="flex flex-wrap gap-1 mt-1">${g.courses.map(c => `<span class="inline-block bg-blue-100 text-blue-800 border border-blue-200 dark:bg-blue-950 dark:text-blue-200 dark:border-blue-800 text-xs px-2 py-0.5 rounded font-medium">${esc(c)}</span>`).join("")}</div></div>`).join("");
            
            return `<div class="${CARD}border-rose-500" ${anim(i, animate)}>
                <div class="flex justify-between items-start gap-2">
                    <div class="min-w-0 flex-1">
                        <h3 class="text-xl font-bold truncate">${esc(r.venue)}</h3>
                        ${getMeta(r.venue)}
                        ${groups}
                    </div>
                    ${actionButtons(r.venue)}
                </div>
                <div class="mt-3 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full rounded-full bg-rose-500" style="inline-size:${pct}%"></div></div>
                <div class="flex justify-between items-center mt-2">
                    <p class="text-xs text-slate-500 dark:text-slate-400">Busy until <span class="font-bold text-slate-700 dark:text-slate-200">${fmtMin(r.busyUntil)}</span> &middot; ${fmtDuration(left)} left</p>
                    <span class="bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 text-xs px-2.5 py-1 rounded-full font-semibold">In Use</span>
                </div>
            </div>`;
        }

        function anim(i, animate) { return animate && i < 12 ? `style="animation-delay:${i * 30}ms"` : (animate ? "" : 'style="animation:none"'); }
        function emptyMsg(text) { return `<p class="text-slate-500 dark:text-slate-400 text-sm italic text-center py-8">${text}</p>`; }

        function renderRooms(animate) {
            const { index, now, search, filter2Hours } = state;
            let { free, busy } = getRoomStates(index, now.day, now.minutes, search);
            const q = search.trim();

            // Apply 2+ Hours Filter
            if (filter2Hours) {
                free = free.filter(r => r.nextStart === null || (r.nextStart - now.minutes) >= 120);
            }

            // Sort so favorites are at the top, then sort by time
            const sortRooms = (arr, isFree) => arr.sort((a, b) => {
                const aFav = favorites.includes(a.venue) ? 1 : 0;
                const bFav = favorites.includes(b.venue) ? 1 : 0;
                if (aFav !== bFav) return bFav - aFav; // Favorites first
                if (isFree) {
                    if (a.nextStart === null) return -1;
                    if (b.nextStart === null) return 1;
                    return a.nextStart - b.nextStart;
                }
                return 0; // Keep busy list order
            });

            sortRooms(free, true);
            sortRooms(busy, false);

            $("availableContainer").innerHTML = free.length ? free.map((r, i) => freeCard(r, i, animate)).join("") : emptyMsg(q ? `No available rooms match &ldquo;${esc(q)}&rdquo;.` : (filter2Hours ? "No rooms free for 2+ hours." : "No rooms available right now."));
            $("busyContainer").innerHTML = busy.length ? busy.map((r, i) => busyCard(r, i, animate)).join("") : emptyMsg(q ? `No ongoing classes match &ldquo;${esc(q)}&rdquo;.` : "No ongoing classes.");

            $("btnAvailable").innerHTML = `Free Now <span class="ml-1 text-[10px] opacity-70">${free.length}</span>`;
            $("btnBusy").innerHTML = `In Use <span class="ml-1 text-[10px] opacity-70">${busy.length}</span>`;

            let notice = "";
            if (!index.daysWithClasses.has(now.day)) notice = `No classes are timetabled on ${esc(now.day)}s, so every room shows as free.`;
            else if (now.minutes < index.open || now.minutes >= index.close) notice = `Outside timetabled hours (${fmtMin(index.open)}&ndash;${fmtMin(index.close)}). Rooms may be locked.`;
            $("notice").innerHTML = notice;
            $("notice").classList.toggle("hidden", !notice);
        }

        function renderTimetable() {
            const container = $("timetableList"); const course = state.selectedCourse;
            if (!course) return container.innerHTML = emptyMsg("Select your course above to view your timetable.");
            const myClasses = state.bookings.filter(b => b.course === course);
            if (myClasses.length === 0) return container.innerHTML = emptyMsg(`No timetable data found for ${esc(course)}.`);

            const dayOrder = { "Monday": 1, "Tuesday": 2, "Wednesday": 3, "Thursday": 4, "Friday": 5, "Saturday": 6, "Sunday": 7 };
            const grouped = {};
            myClasses.forEach(b => { if (!grouped[b.day]) grouped[b.day] = []; grouped[b.day].push(b); });
            const sortedDays = Object.keys(grouped).sort((a, b) => dayOrder[a] - dayOrder[b]);
            let html = "";

            sortedDays.forEach(day => {
                grouped[day].sort((a, b) => toMin(a.start) - toMin(b.start));
                html += `<div><h3 class="text-lg font-bold text-indigo-700 dark:text-indigo-400 mb-2 border-b border-slate-200 dark:border-slate-800 pb-1">${day}</h3><div class="space-y-2">`;
                grouped[day].forEach(c => {
                    html += `<div class="bg-white dark:bg-slate-900 p-3 rounded-xl shadow-sm ring-1 ring-slate-200/70 dark:ring-slate-800 flex gap-3 items-center">
                        <div class="flex-shrink-0 bg-slate-100 dark:bg-slate-800 rounded-lg px-2 py-1 text-center w-16">
                            <p class="text-xs font-bold text-slate-700 dark:text-slate-300">${c.start}</p><p class="text-[10px] text-slate-500">${c.end}</p>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-slate-900 dark:text-slate-100 truncate">${esc(c.module)}</p>
                            <p class="text-xs text-slate-500 truncate">${esc(c.type)} &middot; <span class="font-semibold text-indigo-600 dark:text-indigo-400">${esc(c.venue)}</span></p>
                        </div>
                    </div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function applyView() {
            const v = state.view;
            $("availableContainer").classList.toggle("hidden", v !== "available");
            $("busyContainer").classList.toggle("hidden", v !== "busy");
            $("timetableContainer").classList.toggle("hidden", v !== "timetable");
            $("searchWrapper").classList.toggle("hidden", v === "timetable");
            $("btnAvailable").className = BTN_BASE + (v === "available" ? BTN_ON.available : BTN_OFF);
            $("btnBusy").className = BTN_BASE + (v === "busy" ? BTN_ON.busy : BTN_OFF);
            $("btnTimetable").className = BTN_BASE + (v === "timetable" ? BTN_ON.timetable : BTN_OFF);
        }

        function tick(force = false) {
            const now = campusNow(); $("currentTimeDisplay").textContent = `${now.day}, ${now.label}`;
            if (!state.index) return;
            const key = now.day + "|" + now.minutes;
            if (!force && key === state.lastKey) return;
            state.lastKey = key; state.now = now; renderRooms(true);
        }

        function showError(err) {
            const onFile = location.protocol === "file:";
            const hint = onFile ? `Run <code>python -m http.server</code> in this folder and open <code>http://localhost:8000</code>.` : `Make sure <code>timetable.json</code> is present. (${esc(err.message)})`;
            $("availableContainer").innerHTML = `<div class="bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 p-4 rounded-xl text-sm"><p class="font-bold mb-1">Error loading data</p><p>${hint}</p></div>`;
        }

        async function loadData() {
            try {
                // Load rooms.json (if it exists)
                try {
                    const metaRes = await fetch("rooms.json", { cache: "no-cache" });
                    if (metaRes.ok) roomMeta = await metaRes.json();
                } catch (e) { console.warn("rooms.json not found or invalid."); }

                // Load timetable.json
                const res = await fetch("timetable.json", { cache: "no-cache" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                
                state.bookings = data; state.index = buildIndex(data);

                const courses = [...new Set(data.map(b => b.course).filter(Boolean))].sort();
                const select = $("courseSelect");
                courses.forEach(c => { const opt = document.createElement("option"); opt.value = c; opt.textContent = c; select.appendChild(opt); });

                tick(true);
            } catch (err) { showError(err); }
        }

        // --- EVENT LISTENERS ---
        $("btnAvailable").addEventListener("click", () => { state.view = "available"; applyView(); });
        $("btnBusy").addEventListener("click", () => { state.view = "busy"; applyView(); });
        $("btnTimetable").addEventListener("click", () => { state.view = "timetable"; applyView(); renderTimetable(); });
        $("courseSelect").addEventListener("change", e => { state.selectedCourse = e.target.value; renderTimetable(); });
        
        $("filter2Hours").addEventListener("change", e => {
            state.filter2Hours = e.target.checked;
            renderRooms(true);
        });

        $("searchInput").addEventListener("input", e => {
            state.search = e.target.value;
            $("clearSearch").classList.toggle("hidden", !state.search);
            if (state.index && state.view !== "timetable") renderRooms(false);
        });
        $("clearSearch").addEventListener("click", () => {
            $("searchInput").value = ""; state.search = ""; $("clearSearch").classList.add("hidden");
            if (state.index) renderRooms(false); $("searchInput").focus();
        });

        // --- SHARE & FAVORITE LOGIC (Event Delegation) ---
        document.body.addEventListener("click", e => {
            // Handle Star Click
            const starBtn = e.target.closest('.star-btn');
            if (starBtn) {
                const venue = starBtn.dataset.venue;
                if (favorites.includes(venue)) {
                    favorites = favorites.filter(v => v !== venue);
                    starBtn.classList.remove('star-active');
                    starBtn.classList.add('text-slate-300', 'dark:text-slate-600');
                } else {
                    favorites.push(venue);
                    starBtn.classList.add('star-active');
                    starBtn.classList.remove('text-slate-300', 'dark:text-slate-600');
                }
                localStorage.setItem('ifm_fav_rooms', JSON.stringify(favorites));
                renderRooms(false); // Re-render to re-sort
                return;
            }

            // Handle Share Click
            const shareBtn = e.target.closest('.share-btn');
            if (shareBtn) {
                const venue = shareBtn.dataset.venue;
                const text = `Check out ${venue} at IFM Campus. Open the app to see if it's free right now!`;
                if (navigator.share) {
                    navigator.share({ title: 'IFM Campus Venue', text, url: window.location.href }).catch(console.error);
                } else {
                    navigator.clipboard.writeText(`${text} ${window.location.href}`);
                    alert('Copied to clipboard!');
                }
            }
        });

        applyView(); tick(); setInterval(tick, 15000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
        loadData();
    </script>
</body>
</html>
