<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased pb-20">
    <div class="max-w-md mx-auto px-4 pt-4">

        <header class="relative overflow-hidden rounded-3xl p-5 mb-4 text-white shadow-lg bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600">
            <div class="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-white/10"></div>
            <div class="absolute right-10 -bottom-10 w-24 h-24 rounded-full bg-white/10"></div>
            <h1 class="relative text-3xl font-extrabold tracking-tight">IFM DAR Campus Timetable</h1>
            <p class="relative flex items-center gap-2 mt-1 text-sm font-medium text-blue-100">

            <p class="relative mt-3 text-sm text-white/80">Find a free room or view your class timetable.</p>
        </header>

        <div id="notice" class="hidden mb-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200 text-sm p-3"></div>

        <!-- Search and quick filter (only shown for room views) -->
        <div id="searchWrapper" class="mb-4 space-y-3">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search room (e.g., TH E, 342)..." autocomplete="off"
                    class="w-full p-3 pl-4 pr-10 rounded-xl border border-slate-300 bg-white dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                <button id="clearSearch" type="button" aria-label="Clear search"
                    class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">&times;</button>
            </div>
            <label class="flex items-center justify-between gap-3 bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm cursor-pointer">
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Free for 2+ hours (group study)</span>
                <span class="relative inline-flex items-center flex-shrink-0">
                    <input type="checkbox" id="filter2Hours" class="sr-only peer">
                    <span class="block w-9 h-5 bg-slate-300 dark:bg-slate-700 rounded-full peer-checked:bg-indigo-600 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-500 transition-colors after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></span>
                </span>
            </label>
        </div>

        <!-- 3-Way Toggle Menu -->
        <div class="sticky top-2 z-10 mb-5">
            <div class="flex bg-slate-200/90 dark:bg-slate-800/90 backdrop-blur p-1 rounded-2xl shadow-inner text-sm">
                <button id="btnAvailable" aria-pressed="true" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">Free Now</button>
                <button id="btnBusy" aria-pressed="false" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">In Use</button>
                <button id="btnTimetable" aria-pressed="false" class="flex-1 py-2 rounded-xl font-bold transition-all duration-200">My Classes</button>
            </div>
        </div>

        <!-- ROOM VIEWS -->
        <div id="availableContainer" class="space-y-3"></div>
        <div id="busyContainer" class="space-y-3 hidden"></div>

        <!-- TIMETABLE VIEW -->
        <div id="timetableContainer" class="hidden space-y-4">
            <select id="courseSelect" aria-label="Choose your course" class="w-full p-3 rounded-xl border border-slate-300 bg-white dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm font-semibold">
                <option value="">-- Select your Course --</option>

        <!-- Footer -->
        <footer class="mt-12 pt-6 border-t border-slate-300 dark:border-slate-800 text-center text-sm text-slate-500 dark:text-slate-400 space-y-2">
            <p class="font-bold text-slate-700 dark:text-slate-200">Built by Raheem</p>
            <div class="flex flex-col items-center justify-center space-y-1">

                <a href="tel:+255770931544" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">+255 770 931 544</a>
                <a href="https://instagram.com/sincerely.raheem" target="_blank" rel="noopener noreferrer" class="hover:text-pink-600 dark:hover:text-pink-400 transition-colors">IG: @sincerely.raheem</a>
            </div>

    </div>

    <div id="toast" role="status" aria-live="polite" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 z-20 px-4 py-2 rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-semibold shadow-lg"></div>

    <script>
        // <core> Pure logic: no DOM access, so it can be tested in Node.
        const CAMPUS_TZ = "Africa/Dar_es_Salaam";

        function campusNow(date = new Date()) {
            const parts = new Intl.DateTimeFormat("en-GB", {
                timeZone: CAMPUS_TZ, weekday: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
            }).formatToParts(date);
            const get = type => parts.find(p => p.type === type).value;
            const hour = parseInt(get("hour"), 10) % 24;
            const minute = parseInt(get("minute"), 10);
            return { day: get("weekday"), minutes: hour * 60 + minute, label: fmtMin(hour * 60 + minute) };
        }

        function toMin(t) { const [h, m] = t.split(":"); return parseInt(h, 10) * 60 + parseInt(m, 10); }
        function fmtMin(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
        function fmtDuration(m) {
            if (m < 60) return m + " min";
            const h = Math.floor(m / 60), r = m % 60;
            return r ? h + "h " + r + "m" : h + "h";
        }

        function buildIndex(bookings) {
            const byVenue = new Map();
            const daysWithClasses = new Set();
            let open = 24 * 60, close = 0;
            for (const raw of bookings) {
                if (!raw.venue || !raw.venue.trim()) continue;
                const b = { ...raw, venue: raw.venue.trim(), s: toMin(raw.start), e: toMin(raw.end) };
                if (!(b.e > b.s)) continue;
                open = Math.min(open, b.s);
                close = Math.max(close, b.e);
                daysWithClasses.add(b.day);
                if (!byVenue.has(b.venue)) byVenue.set(b.venue, new Map());
                const days = byVenue.get(b.venue);
                if (!days.has(b.day)) days.set(b.day, []);
                days.get(b.day).push(b);
            }
            for (const days of byVenue.values()) for (const list of days.values()) list.sort((a, c) => a.s - c.s);
            const venues = [...byVenue.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            return { byVenue, venues, open, close, daysWithClasses };
        }

        function getRoomStates(index, day, nowMin, search = "") {
            const q = search.trim().toUpperCase();
            const free = [], busy = [];
            for (const venue of index.venues) {
                if (q && !venue.toUpperCase().includes(q)) continue;
                const today = index.byVenue.get(venue).get(day) || [];
                const current = today.filter(b => b.s <= nowMin && nowMin < b.e);

                if (current.length) {
                    const groups = new Map();
                    for (const b of current) {
                        const key = b.module + "|" + b.type;
                        if (!groups.has(key)) groups.set(key, { module: b.module, type: b.type, courses: [] });
                        const course = b.course || "Unknown Course";
                        const g = groups.get(key);
                        if (!g.courses.includes(course)) g.courses.push(course);
                    }
                    busy.push({
                        venue,
                        startMin: Math.min(...current.map(b => b.s)),
                        busyUntil: Math.max(...current.map(b => b.e)),
                        groups: [...groups.values()]
                    });
                } else {
                    const next = today.find(b => b.s > nowMin);
                    free.push({ venue, nextStart: next ? next.s : null, hadClassesToday: today.length > 0 });
                }
            }
            return { free, busy };
        }

        const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

        // Tutorial groups are written into the module code: "G2_BFU 08103" is group 2. Combined codes such as
        // "G2_AFU 08609 / G3_ECU 08502" carry several tags. A module with no tag is for everybody.
        function moduleGroups(module) {
            const found = new Set();
            for (const m of String(module || "").matchAll(/(?:^|[\s\/])G(\d+)_/g)) found.add(m[1]);
            return found;
        }

        // One course's week, grouped by day. Rows that differ only by room are merged into one class
        // with several venues, and each class on today's date is tagged "now", "next" or "done".
        function getCourseSchedule(bookings, course, nowDay, nowMin, group = "") {
            const slots = new Map();
            const allGroups = new Set();
            for (const b of bookings) {
                if (b.course !== course) continue;
                const tags = moduleGroups(b.module);
                tags.forEach(t => allGroups.add(t));
                if (group && tags.size && !tags.has(group)) continue;   // another group's tutorial
                const key = [b.day, b.start, b.end, b.module, b.type].join("|");
                if (!slots.has(key)) {
                    slots.set(key, { day: b.day, start: b.start, end: b.end, s: toMin(b.start), e: toMin(b.end),
                                     module: b.module, type: b.type, venues: [] });
                }
                const slot = slots.get(key);
                if (b.venue && !slot.venues.includes(b.venue)) slot.venues.push(b.venue);
            }
            const byDay = new Map();
            for (const c of slots.values()) {
                if (!byDay.has(c.day)) byDay.set(c.day, []);
                byDay.get(c.day).push(c);
            }
            const rank = d => { const i = DAY_ORDER.indexOf(d); return i < 0 ? 99 : i; };
            const days = [...byDay.keys()].sort((a, b) => rank(a) - rank(b)).map(day => {
                const classes = byDay.get(day).sort((a, b) => a.s - b.s || a.e - b.e);
                const isToday = day === nowDay;
                let nextFound = false;
                for (const c of classes) {
                    c.status = "";
                    if (!isToday) continue;
                    if (c.s <= nowMin && nowMin < c.e) { c.status = "now"; c.minutesLeft = c.e - nowMin; }
                    else if (c.e <= nowMin) c.status = "done";
                    else if (!nextFound) { c.status = "next"; c.startsIn = c.s - nowMin; nextFound = true; }
                }
                return { day, isToday, classes };
            });
            return { days, total: days.reduce((n, d) => n + d.classes.length, 0),
                     groups: [...allGroups].sort((a, b) => a - b) };
        }

        // ---- Filtering, sorting and labels for the room cards (pure, so they are tested in Node) ----
        function filterFreeForAtLeast(free, nowMin, minutes) {
            return free.filter(r => r.nextStart === null || r.nextStart - nowMin >= minutes);
        }

        // Returns a NEW sorted array. Favourites always come first. Then:
        //   free rooms: the room that stays free longest first (no more classes today counts as longest)
        //   busy rooms: the class that ends soonest first (the room you could get next)
        // Ties keep their original (natural room) order because Array.sort is stable.
        function sortRooms(rooms, kind, favourites) {
            const fav = new Set(favourites);
            const until = r => (r.nextStart === null ? Infinity : r.nextStart);
            return [...rooms].sort((a, b) => {
                const f = fav.has(b.venue) - fav.has(a.venue);
                if (f) return f;
                if (kind === "free") return until(a) === until(b) ? 0 : (until(b) > until(a) ? 1 : -1);
                return a.busyUntil - b.busyUntil;
            });
        }

        // "North Wing · 2nd floor · 120 seats" from a rooms.json entry; blank fields are skipped.
        function metaLine(m) {
            if (!m || typeof m !== "object") return "";
            const parts = [m.building, m.floor].filter(Boolean);
            if (m.capacity) parts.push(m.capacity + " seats");
            return parts.join(" \u00b7 ");
        }

        // One sentence for the Share button, e.g. "TH E is free until 14:00 (1h 30m)."
        function roomStatusText(venue, states, nowMin) {
            const f = states.free.find(r => r.venue === venue);
            if (f) {
                if (f.nextStart === null) {
                    return venue + (f.hadClassesToday ? " is free for the rest of today." : " is free all day.");
                }
                return venue + " is free until " + fmtMin(f.nextStart) + " (" + fmtDuration(f.nextStart - nowMin) + ").";
            }
            const b = states.busy.find(r => r.venue === venue);
            return b ? venue + " is in use until " + fmtMin(b.busyUntil) + "." : venue;
        }
        // </core>

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        const state = { index: null, bookings: [], now: null, view: "available", search: "", lastKey: "", selectedCourse: "", group: "", filter2Hours: false };
        const $ = id => document.getElementById(id);

        const BTN_BASE = "flex-1 py-2 rounded-xl font-bold transition-all duration-200 ";
        const BTN_ON = { available: "bg-white dark:bg-slate-700 shadow text-emerald-700 dark:text-emerald-300", busy: "bg-white dark:bg-slate-700 shadow text-rose-700 dark:text-rose-300", timetable: "bg-white dark:bg-slate-700 shadow text-indigo-700 dark:text-indigo-300" };
        const BTN_OFF = "text-slate-500 dark:text-slate-400";
        const CARD = "pop bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm ring-1 ring-slate-200/70 dark:ring-slate-800 border-l-4 relative ";

        // Star (favourite) and share buttons. The data-venue attribute lets ONE click listener serve every card.
        function actionButtons(venue) {
            const isFav = favourites.includes(venue);
            const star = isFav ? "text-amber-500" : "text-slate-300 dark:text-slate-600";
            return `<div class="flex items-center gap-2 flex-shrink-0">
                <button type="button" class="star-btn text-xl leading-none ${star} hover:scale-110 transition-transform" data-venue="${esc(venue)}" aria-pressed="${isFav}" aria-label="Favourite ${esc(venue)}">&#9733;</button>
                <button type="button" class="share-btn text-slate-400 hover:text-indigo-500 transition-colors" data-venue="${esc(venue)}" aria-label="Share ${esc(venue)}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
                </button></div>`;
        }

        function getMeta(venue) {
            const line = metaLine(roomMeta[venue]);
            return line ? `<p class="text-[11px] text-slate-400 mt-0.5 uppercase tracking-wide font-semibold">${esc(line)}</p>` : "";
        }

        function freeCard(r, i, animate) {
            let sub;
            if (r.nextStart !== null) {
                sub = `Free until <span class="font-bold text-slate-800 dark:text-slate-100">${fmtMin(r.nextStart)}</span> <span class="text-slate-400">&middot; ${fmtDuration(r.nextStart - state.now.minutes)}</span>`;
            } else {
                sub = r.hadClassesToday ? "Free for the rest of today" : "Free all day";
            }
            return `<div class="${CARD}border-emerald-500" ${anim(i, animate)}>
                <div class="flex justify-between items-start gap-2">
                    <div class="min-w-0 flex-1"><h3 class="text-xl font-bold truncate">${esc(r.venue)}</h3>${getMeta(r.venue)}
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${sub}</p></div>
                    ${actionButtons(r.venue)}
                </div>
                <div class="mt-2 text-right"><span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 text-xs px-2.5 py-1 rounded-full font-semibold">Available</span></div></div>`;
        }

        function busyCard(r, i, animate) {
            const total = r.busyUntil - r.startMin;
            const pct = Math.min(100, Math.max(0, Math.round((state.now.minutes - r.startMin) / total * 100)));
            const left = r.busyUntil - state.now.minutes;
            const groups = r.groups.map(g => `
                <div class="mt-2"><p class="text-sm font-semibold text-slate-700 dark:text-slate-200 break-words">${esc(g.type)} &middot; ${esc(g.module)}</p>
                <div class="flex flex-wrap gap-1 mt-1">${g.courses.map(c => `<span class="inline-block bg-blue-100 text-blue-800 border border-blue-200 dark:bg-blue-950 dark:text-blue-200 dark:border-blue-800 text-xs px-2 py-0.5 rounded font-medium">${esc(c)}</span>`).join("")}</div></div>`).join("");
            return `<div class="${CARD}border-rose-500" ${anim(i, animate)}>
                <div class="flex justify-between items-start gap-2">
                    <div class="min-w-0 flex-1"><h3 class="text-xl font-bold truncate">${esc(r.venue)}</h3>${getMeta(r.venue)}${groups}</div>
                    ${actionButtons(r.venue)}
                </div>
                <div class="mt-3 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full rounded-full bg-rose-500" style="inline-size:${pct}%"></div></div>
                <div class="flex justify-between items-center gap-2 mt-2">
                    <p class="text-xs text-slate-500 dark:text-slate-400">Busy until <span class="font-bold text-slate-700 dark:text-slate-200">${fmtMin(r.busyUntil)}</span> &middot; ${fmtDuration(left)} left</p>
                    <span class="flex-shrink-0 bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 text-xs px-2.5 py-1 rounded-full font-semibold">In Use</span>
                </div></div>`;
        }

        function anim(i, animate) { return animate && i < 12 ? `style="animation-delay:${i * 30}ms"` : (animate ? "" : 'style="animation:none"'); }
        function emptyMsg(text) { return `<p class="text-slate-500 dark:text-slate-400 text-sm italic text-center py-8">${text}</p>`; }

        function renderRooms(animate) {
            const { index, now, search, filter2Hours } = state;
            const states = getRoomStates(index, now.day, now.minutes, search);
            let free = states.free;
            if (filter2Hours) free = filterFreeForAtLeast(free, now.minutes, 120);
            free = sortRooms(free, "free", favourites);
            const busy = sortRooms(states.busy, "busy", favourites);
            const q = search.trim();

            $("availableContainer").innerHTML = free.length
                ? free.map((r, i) => freeCard(r, i, animate)).join("")
                : emptyMsg(q ? `No available rooms match &ldquo;${esc(q)}&rdquo;.` : (filter2Hours ? "No rooms are free for 2+ hours." : "No rooms available right now."));
            $("busyContainer").innerHTML = busy.length
                ? busy.map((r, i) => busyCard(r, i, animate)).join("")
                : emptyMsg(q ? `No ongoing classes match &ldquo;${esc(q)}&rdquo;.` : "No ongoing classes.");

            $("btnAvailable").innerHTML = `Free Now <span class="ml-1 text-[10px] opacity-70">${free.length}</span>`;
            $("btnBusy").innerHTML = `In Use <span class="ml-1 text-[10px] opacity-70">${busy.length}</span>`;

            let notice = "";
            if (!index.daysWithClasses.has(now.day)) notice = `No classes are timetabled on ${esc(now.day)}s, so every room shows as free.`;
            else if (now.minutes < index.open || now.minutes >= index.close) notice = `Outside timetabled hours (${fmtMin(index.open)}&ndash;${fmtMin(index.close)}). Rooms may be locked.`;
            $("notice").innerHTML = notice;
            $("notice").classList.toggle("hidden", !notice);
        }

        // --- MY CLASSES VIEW ---
        function classRow(c) {
            let ring = "ring-1 ring-slate-200/70 dark:ring-slate-800", fade = "", badge = "";
            if (c.status === "now") {
                ring = "ring-2 ring-emerald-500";
                badge = `<span class="inline-block mt-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 text-[11px] px-2 py-0.5 rounded-full font-semibold">Now &middot; ${fmtDuration(c.minutesLeft)} left</span>`;
            } else if (c.status === "next") {
                badge = `<span class="inline-block mt-1 bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 text-[11px] px-2 py-0.5 rounded-full font-semibold">Next &middot; in ${fmtDuration(c.startsIn)}</span>`;
            } else if (c.status === "done") {
                fade = "opacity-50";
            }
            const venues = c.venues.length ? c.venues.map(esc).join(" / ") : "Room not listed";
            return `<div class="bg-white dark:bg-slate-900 p-3 rounded-xl shadow-sm ${ring} ${fade} flex gap-3 items-center">
                <div class="flex-shrink-0 bg-slate-100 dark:bg-slate-800 rounded-lg px-2 py-1 text-center w-16">
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-300">${esc(c.start)}</p>
                    <p class="text-[10px] text-slate-500">${esc(c.end)}</p>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100 break-words">${esc(c.module)}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 break-words">${esc(c.type)} &middot; <span class="font-semibold text-indigo-600 dark:text-indigo-400">${venues}</span></p>
                    ${badge}
                </div>
            </div>`;
        }

        function renderTimetable() {
            const container = $("timetableList");
            const course = state.selectedCourse;
            if (!course) {
                $("groupChips").innerHTML = "";
                container.innerHTML = emptyMsg("Select your course above to view your timetable.");
                return;
            }
            const now = state.now || campusNow();
            const sched = getCourseSchedule(state.bookings, course, now.day, now.minutes, state.group);
            if (!sched.total) {
                container.innerHTML = emptyMsg(`No timetable data found for ${esc(course)}.`);
                return;
            }
            const chip = (value, label) => `<button type="button" data-group="${esc(value)}" aria-pressed="${state.group === value}"
                class="px-3 py-1 rounded-full text-xs font-bold ${state.group === value ? "bg-indigo-600 text-white" : "bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-300"}">${esc(label)}</button>`;
            $("groupChips").innerHTML = sched.groups.length > 1
                ? `<span class="text-xs text-slate-500 dark:text-slate-400 mr-1">Tutorial group:</span>` + chip("", "All") + sched.groups.map(g => chip(g, "G" + g)).join("")
                : "";
            const summary = `<p class="text-xs text-slate-500 dark:text-slate-400 px-1">${esc(course)}${state.group ? " &middot; G" + esc(state.group) : ""} &middot; ${sched.total} ${sched.total === 1 ? "class" : "classes"} per week</p>`;
            container.innerHTML = summary + sched.days.map(d => `<div>
                <h3 class="flex items-center gap-2 text-lg font-bold text-indigo-700 dark:text-indigo-400 mb-2 border-b border-slate-200 dark:border-slate-800 pb-1">${esc(d.day)}${d.isToday ? ' <span class="text-[10px] uppercase tracking-wide bg-indigo-600 text-white px-2 py-0.5 rounded-full">Today</span>' : ""}</h3>
                <div class="space-y-2">${d.classes.map(classRow).join("")}</div></div>`).join("");
        }

        // Remember the student's course on this phone. Storage can be blocked, so never let it throw.
        function loadSaved(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
        function save(key, value) { try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); } catch (e) {} }
        const COURSE_KEY = "campusVenues.course", GROUP_KEY = "campusVenues.group";

        // Favourite rooms. The key is unchanged so students who already starred rooms keep them.
        // Parsing is guarded: blocked storage or damaged text must not stop the whole app from starting.
        const FAV_KEY = "ifm_fav_rooms";
        function loadFavourites() {
            try {
                const v = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
                return Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
            } catch (e) { return []; }
        }
        function saveFavourites() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favourites)); } catch (e) {} }
        let favourites = loadFavourites();
        let roomMeta = {};                                   // optional rooms.json: { "TH E": { building, floor, capacity } }

        let toastTimer = null;
        function toast(message) {                            // replaces alert(), which freezes the page until dismissed
            const el = $("toast");
            el.textContent = message;
            el.classList.remove("hidden");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
        }

        function applyView() {
            const v = state.view;
            $("availableContainer").classList.toggle("hidden", v !== "available");
            $("busyContainer").classList.toggle("hidden", v !== "busy");
            $("timetableContainer").classList.toggle("hidden", v !== "timetable");
            
            // Hide search bar if in Timetable mode
            $("searchWrapper").classList.toggle("hidden", v === "timetable");

            $("btnAvailable").className = BTN_BASE + (v === "available" ? BTN_ON.available : BTN_OFF);
            $("btnBusy").className = BTN_BASE + (v === "busy" ? BTN_ON.busy : BTN_OFF);
            $("btnTimetable").className = BTN_BASE + (v === "timetable" ? BTN_ON.timetable : BTN_OFF);
            
            $("btnAvailable").setAttribute("aria-pressed", v === "available");
            $("btnBusy").setAttribute("aria-pressed", v === "busy");
            $("btnTimetable").setAttribute("aria-pressed", v === "timetable");
        }

        function tick(force = false) {
            const now = campusNow();
            $("currentTimeDisplay").textContent = `${now.day}, ${now.label}`;
            if (!state.index) return;
            const key = now.day + "|" + now.minutes;
            if (!force && key === state.lastKey) return;
            state.lastKey = key;
            state.now = now;
            renderRooms(true);
            if (state.selectedCourse) renderTimetable();   // keeps the Now / Next badges current
        }

        function showError(err) {
            const onFile = location.protocol === "file:";
            const hint = onFile ? `Run <code>python -m http.server</code> in this folder and open <code>http://localhost:8000</code> to fix browser security blocks.` : `Make sure <code>timetable.json</code> is present. (${esc(err.message)})`;
            $("availableContainer").innerHTML = `<div class="bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 p-4 rounded-xl text-sm"><p class="font-bold mb-1">Error loading timetable.json</p><p>${hint}</p></div>`;
        }

        async function loadData() {
            try {
                try {                                        // rooms.json is optional: no file, no labels
                    const metaRes = await fetch("rooms.json", { cache: "no-cache" });
                    if (metaRes.ok) {
                        const m = await metaRes.json();
                        roomMeta = m && typeof m === "object" && !Array.isArray(m) ? m : {};
                    }
                } catch (e) { roomMeta = {}; }

                const res = await fetch("timetable.json", { cache: "no-cache" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                
                state.bookings = data;
                state.index = buildIndex(data);

                // Populate Course Dropdown
                const courses = [...new Set(data.map(b => b.course).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                const select = $("courseSelect");
                courses.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c;
                    opt.textContent = c;
                    select.appendChild(opt);
                });

                const saved = loadSaved(COURSE_KEY);
                if (saved && courses.includes(saved)) {      // returning student: go straight to their week
                    select.value = saved;
                    state.selectedCourse = saved;
                    state.group = loadSaved(GROUP_KEY);
                    state.view = "timetable";
                    applyView();
                }
                tick(true);
            } catch (err) {
                showError(err);
            }
        }

        $("btnAvailable").addEventListener("click", () => { state.view = "available"; applyView(); });
        $("btnBusy").addEventListener("click", () => { state.view = "busy"; applyView(); });
        $("btnTimetable").addEventListener("click", () => { state.view = "timetable"; applyView(); renderTimetable(); });

        $("courseSelect").addEventListener("change", e => {
            state.selectedCourse = e.target.value;
            state.group = "";                              // groups belong to one course, so start again
            save(COURSE_KEY, state.selectedCourse);
            save(GROUP_KEY, "");
            renderTimetable();
        });

        $("groupChips").addEventListener("click", e => {
            const btn = e.target.closest("button[data-group]");
            if (!btn) return;
            state.group = btn.dataset.group;
            save(GROUP_KEY, state.group);
            renderTimetable();
        });

        $("filter2Hours").addEventListener("change", e => {
            state.filter2Hours = e.target.checked;
            if (state.index) renderRooms(true);
        });

        // Star and Share: ONE listener for every card (event delegation), because the cards are rebuilt constantly.
        document.body.addEventListener("click", e => {
            const star = e.target.closest(".star-btn");
            if (star) {
                const venue = star.dataset.venue;
                favourites = favourites.includes(venue) ? favourites.filter(v => v !== venue) : [...favourites, venue];
                saveFavourites();
                renderRooms(false);                          // redraw so the favourite moves to the top
                return;
            }
            const share = e.target.closest(".share-btn");
            if (!share || !state.index) return;
            const venue = share.dataset.venue;
            const status = roomStatusText(venue, getRoomStates(state.index, state.now.day, state.now.minutes, venue), state.now.minutes);
            const text = `${status} Check it live at IFM Campus Venues.`;
            const url = location.href;
            if (navigator.share) {
                navigator.share({ title: "IFM Campus Venue", text, url })
                    .catch(err => { if (err && err.name !== "AbortError") toast("Could not share"); });   // closing the sheet is not an error
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(`${text} ${url}`).then(() => toast("Copied to clipboard"), () => toast("Could not copy"));
            } else {
                toast("Sharing is not supported in this browser");
            }
        });

        $("searchInput").addEventListener("input", e => {
            state.search = e.target.value;
            $("clearSearch").classList.toggle("hidden", !state.search);
            if (state.index && state.view !== "timetable") renderRooms(false);
        });
        $("clearSearch").addEventListener("click", () => {
            $("searchInput").value = ""; state.search = "";
            $("clearSearch").classList.add("hidden");
            if (state.index) renderRooms(false);
            $("searchInput").focus();
        });

        applyView();
        tick();
        setInterval(tick, 15000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
        loadData();
    </script>
</body>
</html>
